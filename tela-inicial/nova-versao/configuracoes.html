</defs></svg><a class="skip-link" href="#conteudo">Pular para o conteúdo</a><div class="world" aria-hidden="true"></div><div class="leaves" aria-hidden="true"></div><a class="back-link" href="index.html" aria-label="Voltar à tela inicial"><svg aria-hidden="true"><use href="#arrow"/></svg> Voltar</a><main id="conteudo" class="panel-layout"><section class="wood-panel" aria-labelledby="page-title"><div class="panel-inner"><header class="panel-heading"><p class="eyebrow">CADA AVENTURA TEM SEU RITMO</p><h1 id="page-title">Configurações</h1><span class="heading-leaf"><svg aria-hidden="true"><use href="#leaf"/></svg></span></header><p class="intro">Sua aventura na palma da mão. Toque para ajustar e deslize para mudar o volume.</p><form id="preferences" autocomplete="off"><fieldset><legend>Som da aventura</legend><div class="setting-line"><span class="setting-icon"><svg aria-hidden="true"><use href="#note"/></svg></span><label for="music"><strong>Música ambiente</strong><small>Ative com um toque para ouvir a melodia do menu.</small></label><input class="switch" id="music" name="music" type="checkbox" role="switch"></div><div class="volume-line"><label for="musicVolume">Volume da música</label><input id="musicVolume" name="musicVolume" type="range" min="0" max="100" step="1"><output for="musicVolume" id="musicVolumeValue">40%</output></div><div class="setting-line"><span class="setting-icon"><svg aria-hidden="true"><use href="#sound"/></svg></span><label for="effects"><strong>Efeitos sonoros</strong><small>Toques dos botões e pequenos sons do menu.</small></label><input class="switch" id="effects" name="effects" type="checkbox" role="switch"></div><div class="volume-line"><label for="effectsVolume">Volume dos efeitos</label><input id="effectsVolume" name="effectsVolume" type="range" min="0" max="100" step="1"><output for="effectsVolume" id="effectsVolumeValue">60%</output></div><button type="button" class="quiet-button" id="preview-sound"><svg aria-hidden="true"><use href="#sound"/></svg> Toque para testar o som</button></fieldset><fieldset><legend>Conforto no celular</legend><div class="setting-line"><span class="setting-glyph" aria-hidden="true">Aa</span><label for="largeText"><strong>Texto maior</strong><small>Facilita a leitura nas telas do menu.</small></label><input class="switch" id="largeText" name="largeText" type="checkbox" role="switch"></div><div class="setting-line"><span class="setting-icon"><svg aria-hidden="true"><use href="#leaf"/></svg></span><label for="fallingLeaves"><strong>Folhas no cenário</strong><small>Mostra folhas caindo sem mudar as transições de tela.</small></label><input class="switch" id="fallingLeaves" name="fallingLeaves" type="checkbox" role="switch"></div><div class="setting-line"><span class="setting-icon"><svg aria-hidden="true"><use href="#leaf"/></svg></span><label for="reduceMotion"><strong>Reduzir animações</strong><small>Troca o círculo por uma passagem suave de transparência e pausa as folhas.</small></label><input class="switch" id="reduceMotion" name="reduceMotion" type="checkbox" role="switch" aria-describedby="motion-status"></div><p class="motion-status" id="motion-status" role="status" aria-live="polite"></p></fieldset><div class="settings-bottom"><button class="quiet-button" id="reset" type="button">Restaurar padrões</button><p class="save-status" id="save-status" role="status" aria-live="polite">Suas escolhas são salvas automaticamente.</p></div></form></div></section></main><footer class="page-footer"><span><svg aria-hidden="true"><use href="#leaf"/></svg> Guardião da Natureza</span><span>Jornada de Kai <i>·</i> versão beta</span></footer></body></html>
